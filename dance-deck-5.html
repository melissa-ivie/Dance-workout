.dd{
  --void:#150826; --plum:#26103F; --line:rgba(255,238,255,.13);
  --text:#F7EDFB; --dim:rgba(247,237,251,.58); --faint:rgba(247,237,251,.34);
  --peach:#FF8A6B; --gold:#FFC978; --rose:#F2699C; --mint:#7BE8C6;
  --glass:rgba(255,240,252,.055);
  position:relative; min-height:100vh; overflow-x:hidden;
  background:linear-gradient(168deg,#1B0A31 0%,#150826 46%,#1E0C2C 100%);
  background-color:#150826;
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.dd *{box-sizing:border-box}
.dd .shell{position:relative;z-index:2;max-width:480px;margin:0 auto;
  padding:calc(34px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-left)) calc(72px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-right))}

/* ambient light */
.dd .glow{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:1}
.dd .g1{top:-140px;left:-110px;width:340px;height:340px;background:rgba(255,138,107,.30)}
.dd .g2{bottom:-180px;right:-130px;width:380px;height:380px;background:rgba(123,232,198,.16)}

/* type */
.dd .mono{font-family:'DM Mono',ui-monospace,monospace;letter-spacing:.02em}
.dd .eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--faint)}
.dd h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:38px;line-height:1.04;
  letter-spacing:-.022em;margin:8px 0 0}
.dd .sub{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:19px;margin:0 0 6px;letter-spacing:-.01em}
.dd .dim{color:var(--dim)}
.dd .note{color:var(--dim);font-size:13.5px;line-height:1.55;margin:0 0 14px}

/* tabs */
.dd .tabs{display:flex;gap:4px;margin:22px 0 20px;padding:4px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px)}
.dd .tab{flex:1;padding:10px 6px;border:0;border-radius:999px;background:transparent;color:var(--dim);
  font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  cursor:pointer;transition:color .22s,background .22s}
.dd .tab.on{background:rgba(255,240,252,.13);color:var(--text)}

/* surfaces */
.dd .card{background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:22px;
  margin-bottom:14px;backdrop-filter:blur(14px)}
.dd .card.soft{padding:18px 20px}
.dd .hero{display:flex;flex-direction:column;align-items:center;padding:30px 22px 24px}

/* dial */
.dd .dial{position:relative;width:220px;max-width:72vw;aspect-ratio:1}
.dd .dial svg{width:100%;height:100%;overflow:visible}
.dd .dial circle{fill:none;stroke-linecap:round}
.dd .track{stroke:rgba(255,240,252,.09);stroke-width:13}
.dd .window{stroke:rgba(255,201,120,.30);stroke-width:13}
.dd .arc{stroke:url(#ddArc);stroke-width:13;filter:drop-shadow(0 0 12px rgba(255,138,107,.45));
  transition:stroke-dasharray .75s cubic-bezier(.22,1,.36,1)}
.dd .dialmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dd .dialnum{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:66px;line-height:1;letter-spacing:-.04em}
.dd .dialunit{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-top:6px}
.dd .hint{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:16px}

/* track rows */
.dd .tracks{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.dd .trk{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;
  background:var(--glass);border:1px solid var(--line)}
.dd .idx{font-size:12px;color:var(--faint);min-width:20px}
.dd .trkbody{flex:1;min-width:0}
.dd .trk h3{font-size:15px;font-weight:500;line-height:1.35;margin:0}
.dd .logttl{margin-top:5px!important;font-weight:400!important;color:var(--dim)}
.dd .meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--faint);margin-top:6px;flex-wrap:wrap}
.dd .sep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
.dd .tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap;padding:5px 10px;border-radius:999px;border:1px solid var(--line)}
.dd .tag.fresh{color:#2A1140;background:linear-gradient(120deg,var(--gold),var(--peach));border-color:transparent;font-weight:500}
.dd .empty{padding:26px 20px;border-radius:20px;border:1px dashed var(--line);
  color:var(--dim);font-size:14px;line-height:1.6;text-align:center}

/* buttons */
.dd .btn{width:100%;padding:16px;border:0;border-radius:18px;cursor:pointer;
  font-family:'Inter',sans-serif;font-size:15px;font-weight:600;letter-spacing:.01em;
  background:rgba(255,240,252,.11);color:var(--text);border:1px solid var(--line);
  margin-top:10px;transition:transform .12s,filter .2s,background .2s}
.dd .btn.big{background:linear-gradient(112deg,var(--gold),var(--peach) 55%,var(--rose));
  color:#2A1140;border-color:transparent;font-size:16.5px;padding:18px;
  box-shadow:0 12px 34px -14px rgba(255,138,107,.85);
  display:flex;align-items:center;justify-content:center;gap:10px}
.dd .btn.ghost{background:transparent}
.dd .btn:active{transform:scale(.985)}
.dd .btn:disabled{opacity:.5;cursor:default}
.dd .btnrow{display:flex;gap:10px}
.dd .tri{width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;
  border-bottom:7px solid transparent;margin-left:2px}
.dd .chip{padding:7px 13px;border-radius:999px;background:transparent;border:1px solid var(--line);
  color:var(--dim);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;white-space:nowrap}
.dd .chip:active{background:rgba(255,240,252,.09)}
.dd .link{display:block;width:100%;margin-top:12px;background:none;border:0;color:var(--faint);
  font-family:'DM Mono',monospace;font-size:11.5px;text-decoration:underline;
  text-underline-offset:4px;cursor:pointer}
.dd .quiet{display:block;text-align:center;margin-top:14px;color:var(--faint);font-size:12px;
  text-decoration:none;font-family:'DM Mono',monospace}

/* player */
.dd .frame{position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;background:#000;
  box-shadow:0 20px 50px -24px rgba(0,0,0,.9)}
.dd .frame > *{position:absolute;inset:0;width:100%;height:100%;border:0}
.dd .nowbar{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.dd .nowttl{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:21px;line-height:1.25;margin:8px 0 0;letter-spacing:-.01em}
.dd .eq{display:flex;align-items:flex-end;gap:2.5px;height:13px}
.dd .eq i{width:3px;border-radius:2px;background:var(--peach);animation:eq .9s ease-in-out infinite}
.dd .eq i:nth-child(1){height:6px;animation-delay:-.2s}
.dd .eq i:nth-child(2){height:13px;animation-delay:-.5s}
.dd .eq i:nth-child(3){height:9px}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.dd .dots{display:flex;gap:6px;margin-top:14px}
.dd .dot{flex:1;height:3px;border-radius:2px;background:rgba(255,240,252,.14)}
.dd .dot.past{background:rgba(255,240,252,.42)}
.dd .dot.here{background:linear-gradient(90deg,var(--gold),var(--peach))}

/* rotation + stats */
.dd .rowbetween{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}
.dd .bar{height:6px;border-radius:999px;background:rgba(255,240,252,.1);margin:12px 0 4px;overflow:hidden}
.dd .barfill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mint),#9FE8FF);
  transition:width .6s cubic-bezier(.22,1,.36,1)}
.dd .stats{display:flex;justify-content:space-between;gap:12px;text-align:center}
.dd .stat{flex:1}
.dd .stat b{display:block;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:32px;line-height:1;letter-spacing:-.02em}
.dd .stat span{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;margin-top:8px}
.dd .counts{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:22px 4px 12px}

/* inputs */
.dd .field{width:100%;padding:14px 16px;border-radius:15px;border:1px solid var(--line);
  background:rgba(10,4,20,.35);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;margin-bottom:2px}
.dd .field::placeholder{color:var(--faint)}
.dd .mini{width:42px;padding:2px 6px;border-radius:8px;border:1px solid var(--line);
  background:rgba(10,4,20,.35);color:var(--text);font-family:'DM Mono',monospace;font-size:11.5px;text-align:center}
.dd input[type=number]{-moz-appearance:textfield}
.dd input::-webkit-outer-spin-button,.dd input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dd .switch{margin-top:18px;font-size:14px;color:var(--dim)}
.dd .toggle{width:50px;height:29px;border-radius:999px;border:1px solid var(--line);
  background:rgba(10,4,20,.4);cursor:pointer;padding:3px;display:flex;transition:background .25s}
.dd .toggle.on{background:linear-gradient(100deg,var(--gold),var(--peach));border-color:transparent}
.dd .knob{width:21px;height:21px;border-radius:50%;background:var(--text);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.dd .toggle.on .knob{transform:translateX(21px);background:#2A1140}

/* lists */
.dd .lists{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.dd .listrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 15px;border-radius:16px;background:rgba(10,4,20,.3);border:1px solid var(--line)}
.dd .listname{font-size:14px;font-weight:500;line-height:1.3}
.dd .working{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:12px;color:var(--dim)}
.dd .spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,240,252,.2);
  border-top-color:var(--peach);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* alert, modal, toast */
.dd .alert{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:16px;
  background:rgba(242,105,156,.16);border:1px solid rgba(242,105,156,.4);font-size:13.5px;
  line-height:1.5;margin-bottom:14px}
.dd .alert.warn{background:rgba(255,201,120,.14);border-color:rgba(255,201,120,.42)}
.dd .alert.warn b{display:block;margin-bottom:4px}
.dd .alert-x{background:none;border:0;color:var(--text);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.dd .scrim{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:22px;background:rgba(10,4,20,.72);backdrop-filter:blur(7px)}
.dd .modal{width:100%;max-width:370px;padding:28px 24px 24px;border-radius:28px;text-align:center;
  background:linear-gradient(170deg,#2C1247,#1B0A31);border:1px solid var(--line);
  box-shadow:0 30px 70px -28px #000}
.dd .modalmin{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:60px;line-height:1;
  letter-spacing:-.04em;margin:12px 0 10px}
.dd .modalmin span{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin-left:8px}
.dd .modallist{color:var(--dim);font-size:13.5px;line-height:1.55;margin:0 0 20px}
.dd .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;
  max-width:min(420px,calc(100vw - 40px));padding:13px 22px;border-radius:999px;
  background:linear-gradient(110deg,var(--mint),#9FE8FF);color:#10261F;font-size:13.5px;
  font-weight:600;box-shadow:0 16px 40px -16px rgba(0,0,0,.8);text-align:center}

/* boot + motion */
.dd .boot{display:flex;gap:8px;align-items:center;justify-content:center;min-height:60vh}
.dd .boot-dot{width:9px;height:9px;border-radius:50%;background:var(--peach);animation:bob 1s ease-in-out infinite}
.dd .boot-dot:nth-child(2){animation-delay:.15s;background:var(--gold)}
.dd .boot-dot:nth-child(3){animation-delay:.3s;background:var(--rose)}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-9px);opacity:1}}
.dd .rise{animation:rise .55s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.dd .pop{animation:pop .3s cubic-bezier(.22,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.dd .importer{height:0;overflow:hidden;border-radius:16px;transition:height .3s ease,margin .3s ease}
.dd .importer.show{height:180px;margin-top:14px}
.dd .importer iframe{width:100%;height:180px;border:0;border-radius:16px;display:block}
.dd .foot{margin-top:26px;text-align:center;font-size:10.5px;letter-spacing:.09em;color:var(--faint);line-height:1.8}
.dd button:focus-visible,.dd input:focus-visible,.dd a:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  .dd *,.dd *::before,.dd *::after{animation:none!important;transition:none!important}
}
